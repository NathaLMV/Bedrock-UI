name: Build iOS
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen
      - name: Build
        run: |
          xcodebuild \
          -project BedrockUI.xcodeproj \
          -scheme BedrockUI \
          -sdk iphoneos \
          -configuration Release \
          -derivedDataPath build \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          build
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r BedrockUI.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: BedrockUI-ipa
          path: BedrockUI.ipa
